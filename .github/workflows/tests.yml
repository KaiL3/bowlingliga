# Runs the complete test suite (unit, property and integration tests) against
# a MariaDB service for every push to main and every pull request. Like the
# local rule: green means no failures, no skipped tests, no deprecations or
# notices. A second job scans the whole history for secrets (gitleaks).
name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phpunit:
    name: PHPUnit (PHP ${{ matrix.php }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        # Lowest supported version (composer.json) and current ones.
        php: ['8.3', '8.4', '8.5']

    services:
      mariadb:
        image: mariadb:11.4
        env:
          # The integration tests connect as root without password and
          # rebuild the database bowlingliga_test themselves.
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: '1'
          MARIADB_DATABASE: bowlingliga_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_mysql, sodium, gd, fileinfo, zip, curl, mbstring
          coverage: none
          tools: composer:v2

      - name: Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-php${{ matrix.php }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-php${{ matrix.php }}-

      - name: Validate composer.json and composer.lock
        run: composer validate --strict --no-interaction

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run tests
        env:
          BOWLINGLIGA_TEST_DB_HOST: 127.0.0.1
          BOWLINGLIGA_TEST_DB_PORT: '3306'
          BOWLINGLIGA_TEST_DB_USER: root
          BOWLINGLIGA_TEST_DB_PASSWORD: ''
        run: vendor/bin/phpunit --fail-on-all-issues --display-all-issues

  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # renovate: datasource=github-releases depName=gitleaks/gitleaks
      GITLEAKS_VERSION: 8.30.1

    steps:
      - uses: actions/checkout@v7
        with:
          # The whole history, not only the last commit.
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$archive" "$base/$archive"
          curl -sSfL -o checksums.txt "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " $archive\$" checksums.txt | sha256sum --check --strict
          tar -xzf "$archive" gitleaks
          rm "$archive" checksums.txt

      - name: Scan the history
        run: ./gitleaks git . --config .gitleaks.toml --redact --no-banner --exit-code 1
